name: Build Musify (Android, iOS, Windows, macOS, Linux)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Build web & sync Android
        run: |
          npm ci
          npm run build
          npx cap sync android
      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Musify-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

  build-desktop:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: Windows
          - os: macos-latest
            platform: macOS
          - os: ubuntu-latest
            platform: Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build production frontend
        run: |
          npm ci
          npm run build
      - name: Package standalone bundle
        shell: bash
        run: |
          mkdir -p release
          cp -r dist server.py requirements.txt start_musify.ps1 start_musify.sh README.md release/
      - name: Upload ${{ matrix.platform }} Bundle
        uses: actions/upload-artifact@v4
        with:
          name: Musify-${{ matrix.platform }}
          path: release/
